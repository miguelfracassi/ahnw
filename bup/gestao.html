<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Gestão de contas · Ticord</title><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Silkscreen:wght@400;700&display=swap"><link rel="stylesheet" href="/site.css"><style>
body{padding-top:0}.ad{max-width:1040px;margin:0 auto;padding:28px 20px 60px}
.ad h1{font-size:clamp(1.5rem,4vw,2.1rem);margin:0 0 6px}.ad .lead{margin:0 0 22px;font-size:1rem}.lead a{color:#1b5fd1}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.bar input{flex:1;min-width:200px;padding:11px 18px}
.bar .btn,.fl2 .btn{padding:10px 18px;font-size:.9rem}
.fl2{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.fl2 .btn[aria-pressed=false]{background:#fff;color:var(--ink)}
.tw{overflow-x:auto;background:#fff;border:2px solid var(--ink);border-radius:24px;box-shadow:6px 6px 0 var(--ink)}
table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:12px 16px;border-bottom:1px solid #e4e4ea;white-space:nowrap}
th{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:#555}tr:last-child td{border-bottom:0}tr.bn td{background:#fff3f3}
.st{display:inline-block;font-weight:700;font-size:.8rem;border-radius:999px;padding:3px 12px;border:2px solid var(--ink);background:#c8f2cf}.st.b{background:#ffc9c9}
.ac{display:flex;gap:6px;flex-wrap:wrap}.ac button{font:inherit;font-weight:700;font-size:.82rem;cursor:pointer;border:2px solid var(--ink);border-radius:999px;padding:5px 12px;background:#fff}
.ac button:hover{transform:translateY(-1px)}.ac button:focus-visible{outline:3px solid var(--b)}.ac .dg{color:#c62828;border-color:#c62828}
.empty{text-align:center;padding:30px;color:#666}.login{max-width:420px;margin:12vh auto 0}.login form{display:grid;gap:12px}
.msg{font-weight:700;margin:12px 0 0;min-height:1.3em}.msg.ok{color:#1b7f3b}.msg.er{color:#c62828}
dialog{border:2px solid var(--ink);border-radius:28px;padding:24px;max-width:430px;width:calc(100% - 32px);box-shadow:8px 8px 0 var(--ink);font-family:inherit}dialog::backdrop{background:#0006}
dialog h2{margin:0 0 4px;font-size:1.3rem}dialog p{margin:0 0 14px;color:#444}dialog form{display:grid;gap:12px}.row{display:flex;gap:8px}.row .btn{padding:10px 16px;font-size:.9rem;white-space:nowrap}
</style></head><body><main class="ad">
<section class="card login" id="lg"><h1>Gestão · Ticord</h1><p class="lead">Contas do Bup. Digite a chave de acesso.</p>
<form id="lf"><input id="key" type="password" autocomplete="current-password" placeholder="Chave de acesso" required><p class="err" id="le" role="alert"></p><button class="btn" type="submit">Entrar</button></form></section>
<section id="pn" hidden><h1>Gestão de contas</h1><p class="lead">Quem se cadastrou no Bup. A senha nunca aparece; só dá para trocar por uma nova. <a href="/admin">← Voltar ao /admin</a></p>
<div class="bar"><input id="q" type="search" placeholder="Buscar por nome ou e-mail"><button class="btn alt" id="rf" type="button">Atualizar</button><button class="btn alt" id="out" type="button">Sair</button></div>
<div class="fl2" role="group" aria-label="Filtro"><button class="btn" type="button" data-f="all" aria-pressed="true"></button><button class="btn" type="button" data-f="act" aria-pressed="false"></button><button class="btn" type="button" data-f="ban" aria-pressed="false"></button></div>
<div class="tw"><table><thead><tr><th>#</th><th>Nome</th><th>E-mail</th><th>Status</th><th>Cadastro</th><th>Msgs</th><th>Ações</th></tr></thead><tbody id="tb"></tbody></table></div>
<p class="msg" id="ms" role="status"></p></section>
</main>
<dialog id="dp"><form method="dialog" id="pf"><h2>Mudar senha</h2><p id="dn"></p>
<label for="np" style="font-weight:700;font-size:.9rem">Nova senha (8 a 100 caracteres)</label>
<div class="row"><input id="np" type="text" minlength="8" maxlength="100" autocomplete="off" required><button class="btn alt" id="gen" type="button">Gerar</button></div>
<p class="err" id="pe" role="alert"></p>
<div class="row"><button class="btn" type="submit" id="ps">Salvar nova senha</button><button class="btn alt" type="button" id="pc">Cancelar</button></div></form></dialog>
<script>
(()=>{
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let key='',rows=[],flt='all',tgt=null;try{key=sessionStorage.getItem('adm')||''}catch(e){}
const fmtD=t=>new Date(t).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
const api=(m,b)=>fetch('/api/admin-users',{method:m,headers:Object.assign({'x-admin-key':key},b?{'Content-Type':'application/json'}:{}),body:b?JSON.stringify(b):undefined}).then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||'Erro'),{st:r.status});return j});
const say=(t,c)=>{const m=$('#ms');m.textContent=t;m.className='msg '+(c||'')};
const draw=()=>{const q=$('#q').value.trim().toLowerCase(),nb=rows.filter(r=>r.banned).length;
 const lab={all:'Todos ('+rows.length+')',act:'Ativos ('+(rows.length-nb)+')',ban:'Banidos ('+nb+')'};
 document.querySelectorAll('[data-f]').forEach(b=>{b.textContent=lab[b.dataset.f];b.setAttribute('aria-pressed',b.dataset.f===flt)});
 const l=rows.filter(r=>(flt==='all'||(flt==='ban'?r.banned:!r.banned))&&(!q||r.name.toLowerCase().includes(q)||r.email.toLowerCase().includes(q)));
 $('#tb').innerHTML=l.length?l.map(r=>`<tr class="${r.banned?'bn':''}"><td>${r.id}</td><td>${esc(r.name)}</td><td>${esc(r.email)}</td><td><span class="st${r.banned?' b':''}">${r.banned?'Banido':'Ativo'}</span></td><td>${esc(fmtD(r.created_at))}</td><td>${r.msgs}</td>
 <td><div class="ac"><button type="button" data-a="${r.banned?'unban':'ban'}" data-id="${r.id}">${r.banned?'Desbanir':'Banir'}</button><button type="button" data-a="pw" data-id="${r.id}">Mudar senha</button><button type="button" class="dg" data-a="delete" data-id="${r.id}">Excluir</button></div></td></tr>`).join(''):'<tr><td colspan="7" class="empty">Nenhuma conta encontrada.</td></tr>'};
const load=async()=>{const j=await api('GET');rows=j.rows;$('#lg').hidden=true;$('#pn').hidden=false;draw()};
const bye=()=>{key='';try{sessionStorage.removeItem('adm')}catch(e){}$('#pn').hidden=true;$('#lg').hidden=false;$('#key').value=''};
const fail=x=>x.st===401?bye():say(x.message,'er');
$('#lf').onsubmit=async e=>{e.preventDefault();$('#le').textContent='';key=$('#key').value;try{await load();try{sessionStorage.setItem('adm',key)}catch(x){}}catch(x){$('#le').textContent=x.message}};
$('#q').oninput=draw;$('#out').onclick=bye;$('#rf').onclick=()=>{say('');load().catch(fail)};
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{flt=b.dataset.f;draw()});
$('#tb').onclick=async e=>{const b=e.target.closest('button[data-a]');if(!b)return;const r=rows.find(x=>x.id==b.dataset.id),a=b.dataset.a;if(!r)return;say('');
 if(a==='pw'){tgt=r;$('#dn').textContent=r.name+' · '+r.email;$('#np').value='';$('#pe').textContent='';$('#dp').showModal();return $('#np').focus()}
 const q={ban:'Banir '+r.name+' ('+r.email+')? A pessoa será desconectada e não conseguirá mais entrar.',unban:'Desbanir '+r.name+' ('+r.email+')?',delete:'EXCLUIR a conta de '+r.name+' ('+r.email+')? Apaga também as conversas. Não dá para desfazer.'}[a];
 if(!confirm(q))return;
 try{await api('POST',{action:a,id:r.id});
  if(a==='delete'){rows=rows.filter(x=>x.id!==r.id);say('Conta excluída.','ok')}else{r.banned=a==='ban';say(a==='ban'?'Conta banida.':'Conta desbanida.','ok')}draw()}catch(x){fail(x)}};
$('#gen').onclick=()=>{const A='abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789',v=crypto.getRandomValues(new Uint32Array(12));$('#np').value=[...v].map(n=>A[n%A.length]).join('')};
$('#pc').onclick=()=>$('#dp').close();
$('#pf').onsubmit=async e=>{e.preventDefault();const pw=$('#np').value;$('#pe').textContent='';
 if(pw.length<8||pw.length>100)return $('#pe').textContent='A senha precisa ter entre 8 e 100 caracteres.';
 $('#ps').disabled=true;try{await api('POST',{action:'set_password',id:tgt.id,password:pw});$('#dp').close();say('Senha de '+tgt.name+' alterada. Passe a nova senha para a pessoa.','ok')}
 catch(x){if(x.st===401){$('#dp').close();bye()}else $('#pe').textContent=x.message}$('#ps').disabled=false};
if(key)load().catch(bye);
})();
</script></body></html>
